<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八族場景插圖預覽</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/screens.css">
<style>
  body { display: block; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 760px; }
  .item { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; background: var(--surface); }
  .item h3 { margin: 0 0 4px; font-size: var(--font-size-base); }
  .item p { margin: 0; font-size: var(--font-size-sm); color: var(--text-dim); }
  .item .scene-art { width: 100%; height: 120px; }
</style>
</head>
<body>
<h1 style="font-size:1.25rem">八族場景插圖</h1>
<div class="grid" id="grid"></div>
<script type="module">
import { renderSceneArt } from '../js/components/scene-art.js';
const groups = await (await fetch('../data/mnemonics-groups.json')).json();
const grid = document.getElementById('grid');
groups.forEach(g => {
  const box = document.createElement('div');
  box.className = 'item';
  const h = document.createElement('h3');
  h.textContent = `${g.group}　${g.name}　${g.chant}`;
  const art = renderSceneArt(g.group, g.scene);
  const p = document.createElement('p');
  p.textContent = g.scene;
  box.append(h);
  if (art) box.appendChild(art);
  box.appendChild(p);
  grid.appendChild(box);
});
</script>
</body>
</html>
